name: Keep Render service awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          test -n "$RENDER_BACKEND_URL" || { echo "Set the RENDER_BACKEND_URL repository secret first."; exit 1; }
          curl --fail --silent --show-error --retry 2 "$RENDER_BACKEND_URL/api/health"
